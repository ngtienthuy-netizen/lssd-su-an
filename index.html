<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSSD - Hệ Thống Hỗ Trợ Xử Án</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <style>
        :root {
            --primary: #d4a017;
            --dark: #1a1a1a;
            --glass: rgba(255, 255, 255, 0.95);
            --shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* LOGIN BOX */
        #login-screen {
            background: var(--glass);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            width: 350px;
        }
        #login-screen h2 { color: var(--primary); margin-bottom: 20px; }
        input[type="email"], input[type="password"], input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .btn-main {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        /* APP INTERFACE */
        #app-screen {
            display: none;
            width: 95%;
            max-width: 1200px;
            background: var(--glass);
            border-radius: 15px;
            height: 90vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow);
        }
        header {
            background: #fff;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            flex: 1;
            overflow: hidden;
        }

        /* LEFT COLUMN: CRIMES */
        .crimes-container {
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #eee;
        }
        .search-bar {
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            background: var(--glass);
            z-index: 10;
        }
        .law-section { margin-bottom: 25px; }
        .law-section h3 { border-left: 4px solid var(--primary); padding-left: 10px; margin-bottom: 10px; }
        .crime-card {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #fff;
            margin-bottom: 5px;
            border-radius: 5px;
            transition: 0.2s;
            cursor: pointer;
            border: 1px solid #eee;
        }
        .crime-card:hover { background: #fff9e6; }
        .crime-card input { margin-right: 15px; transform: scale(1.3); }

        /* RIGHT COLUMN: CALCULATION */
        .calc-container {
            padding: 20px;
            background: #f9f9f9;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .output-box {
            background: #fff9e6;
            border: 2px solid #e74c3c;
            padding: 20px;
            border-radius: 10px;
            font-weight: bold;
            white-space: pre-wrap;
            min-height: 150px;
            font-family: monospace;
        }
        .reduction-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 13px;
        }

        /* RESPONSIVE */
        @media (max-width: 900px) {
            .main-layout { grid-template-columns: 1fr; }
            .calc-container { order: -1; height: auto; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <img src="https://i.imgur.com/LSSD-LOGO-HERE.png" alt="LSSD LOGO" width="100">
        <h2>LSSD SYSTEM</h2>
        <input type="email" id="email" placeholder="Email sĩ quan">
        <input type="password" id="pass" placeholder="Mật khẩu">
        <button class="btn-main" onclick="handleLogin()">ĐĂNG NHẬP</button>
        <p id="error" style="color:red; font-size:12px"></p>
    </div>

    <div id="app-screen">
        <header>
            <div style="font-weight: bold; color: var(--primary)">LSSD - HỖ TRỢ XỬ ÁN</div>
            <button onclick="handleLogout()" style="background:none; border:none; color:red; cursor:pointer">Đăng xuất</button>
        </header>

        <div class="main-layout">
            <div class="crimes-container">
                <div class="search-bar">
                    <input type="text" id="search" placeholder="🔍 Tìm kiếm tội danh nhanh..." oninput="filterCrimes()">
                </div>
                
                <div id="law-list">
                    </div>
            </div>

            <div class="calc-container">
                <input type="text" id="obj-name" placeholder="Tên đối tượng">
                <input type="text" id="obj-cccd" placeholder="Số CCCD">
                
                <div class="reduction-panel">
                    <label><input type="checkbox" id="nvqs" onchange="calculate()"> Giấy NVQS</label>
                    <label><input type="checkbox" id="coop" onchange="calculate()"> Hợp tác (5p)</label>
                    <label><input type="checkbox" id="invest" onchange="calculate()"> Điều tra (10p)</label>
                    <input type="number" id="bills" placeholder="Số bill nợ" oninput="calculate()">
                </div>

                <div class="output-box" id="result-display">
Tên: 
CCCD: 
Tội danh: 
Mức án: 0p
Đã xử lý
                </div>

                <button class="btn-main" onclick="copyResult()">SAO CHÉP HỒ SƠ</button>
                <button class="btn-main" style="background:#7f8c8d" onclick="resetForm()">RESET</button>
            </div>
        </div>
    </div>

<script>
    // --- 1. CẤU HÌNH FIREBASE ---
    const firebaseConfig = {
        apiKey: "AIza...", 
        authDomain: "your-app.firebaseapp.com",
        projectId: "your-app",
        storageBucket: "your-app.appspot.com",
        messagingSenderId: "...",
        appId: "..."
    };
    firebase.initializeApp(firebaseConfig);

    // --- 2. DỮ LIỆU LUẬT (Full bộ luật bạn gửi) ---
    const LAW_DATA = [
        { title: "KHOẢN 1 (20 PHÚT)", time: 20, stack: false, items: ["Sử dụng nắm đấm gây rối", "Gây rối trật tự công cộng", "Cản trở người thi hành công vụ", "Hỗ trợ đồng bọn", "Sử dụng giáp trái phép", "Trộm cắp tài sản", "Nhập cư trái phép", "Vũ khí thô sơ công cộng", "Tàng trữ thảo dược", "Vu khống", "Lăng mạ xúc phạm", "Xúc phạm người đang làm nhiệm vụ"] },
        { title: "KHOẢN 2 (30 PHÚT)", time: 30, stack: false, items: ["Gây thương tích chưa nghiêm trọng", "Chống đối người thi hành công vụ", "Xâm nhập trụ sở", "Đe dọa sĩ quan", "Rao bán vũ khí lậu", "Lừa đảo chiếm đoạt", "Giả dạng người nhà nước"] },
        { title: "KHOẢN 3 & 4 (50p - 100p)", time: 50, stack: true, items: ["Gây thương tích nghiêm trọng", "Bạo động thành phố (x50p)", "Tấn công nhân viên y tế (x100p)"] }
    ];

    // --- 3. LOGIC HỆ THỐNG ---
    function handleLogin() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('pass').value;
        firebase.auth().signInWithEmailAndPassword(email, pass).catch(e => {
            document.getElementById('error').innerText = "Lỗi đăng nhập!";
        });
    }

    function handleLogout() { firebase.auth().signOut(); }

    firebase.auth().onAuthStateChanged(user => {
        const loginScr = document.getElementById('login-screen');
        const appScr = document.getElementById('app-screen');
        if (user) {
            loginScr.style.display = 'none';
            appScr.style.display = 'flex';
            initLawList();
        } else {
            loginScr.style.display = 'block';
            appScr.style.display = 'none';
        }
    });

    function initLawList() {
        let html = '';
        LAW_DATA.forEach((section, sIdx) => {
            html += `<div class="law-section"><h3>${section.title}</h3>`;
            section.items.forEach((item, iIdx) => {
                html += `
                <div class="crime-card" onclick="toggleCB('${sIdx}-${iIdx}')">
                    <input type="checkbox" class="cb-crime" id="cb-${sIdx}-${iIdx}" 
                           data-name="${item}" data-time="${section.time}" 
                           data-stack="${section.stack}" onchange="calculate()">
                    <span>${item}</span>
                </div>`;
            });
            html += `</div>`;
        });
        document.getElementById('law-list').innerHTML = html;
    }

    function toggleCB(id) {
        const cb = document.getElementById('cb-' + id);
        cb.checked = !cb.checked;
        calculate();
    }

    function calculate() {
        let name = document.getElementById('obj-name').value || "Chưa rõ";
        let cccd = document.getElementById('obj-cccd').value || "Chưa rõ";
        let total = 0, selected = [], hasK2 = false;

        document.querySelectorAll('.cb-crime:checked').forEach(cb => {
            let time = parseInt(cb.dataset.time);
            total += time;
            selected.push(cb.dataset.name);
            if(time >= 30) hasK2 = true;
        });

        // Logic Nợ xấu & Giảm án
        let bills = parseInt(document.getElementById('bills').value) || 0;
        if(hasK2 && bills > 5) total += (bills - 5) * 5;
        if(document.getElementById('nvqs').checked) total -= 5;
        if(document.getElementById('coop').checked) total -= 5;
        if(document.getElementById('invest').checked) total -= 10;

        const result = `Tên: ${name}\nCCCD: ${cccd}\nTội danh: ${selected.join(', ') || 'Không có'}\nMức án: ${total > 0 ? total : 0}p\nĐã xử lý`;
        document.getElementById('result-display').innerText = result;
    }

    function filterCrimes() {
        let query = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.crime-card').forEach(card => {
            let text = card.innerText.toLowerCase();
            card.style.display = text.includes(query) ? 'flex' : 'none';
        });
    }

    function copyResult() {
        navigator.clipboard.writeText(document.getElementById('result-display').innerText);
        alert("Đã sao chép hồ sơ!");
    }

    function resetForm() {
        location.reload();
    }
</script>
</body>
</html>
