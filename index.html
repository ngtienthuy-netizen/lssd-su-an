<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSSD - Hệ Thống Hỗ Trợ Xử Án</title>
    <style>
        :root {
            --primary: #d4a017;
            --dark: #1a1a1a;
            --glass: rgba(255, 255, 255, 0.95);
            --shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%);
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* CHỈ HIỆN LOGIN BOX KHI CHƯA ĐĂNG NHẬP */
        #login-screen {
            background: var(--glass);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            width: 350px;
            z-index: 999;
        }
        #login-screen h2 { color: var(--primary); margin-bottom: 20px; }
        
        input[type="text"], input[type="password"], input[type="number"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
        }
        .btn-main {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        /* ẨN TOÀN BỘ APP SCREEN MẶC ĐỊNH */
        #app-screen {
            display: none;
            width: 95%;
            max-width: 1200px;
            background: var(--glass);
            border-radius: 15px;
            height: 90vh;
            overflow: hidden;
            flex-direction: column;
            box-shadow: var(--shadow);
            position: fixed;
        }

        header {
            background: #fff;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary);
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            flex: 1;
            overflow: hidden;
        }

        .crimes-container { padding: 20px; overflow-y: auto; border-right: 1px solid #eee; }
        .search-bar { margin-bottom: 20px; position: sticky; top: 0; background: #fff; z-index: 10; }
        .law-section { margin-bottom: 25px; }
        .law-section h3 { border-left: 4px solid var(--primary); padding-left: 10px; margin-bottom: 10px; }
        .crime-card {
            display: flex; align-items: center; padding: 10px; background: #fff; margin-bottom: 5px;
            border-radius: 5px; border: 1px solid #eee; cursor: pointer; transition: 0.2s;
        }
        .crime-card:hover { background: #fff9e6; }
        .crime-card input[type="checkbox"] { margin-right: 15px; transform: scale(1.3); }
        .crime-card input[type="number"] { width: 60px; margin-left: auto; padding: 5px; border-radius: 4px; border: 1px solid #ccc; }

        .calc-container { padding: 20px; background: #f9f9f9; display: flex; flex-direction: column; gap: 15px; }
        .output-box { background: #fff9e6; border: 2px solid #e74c3c; padding: 20px; border-radius: 10px; font-weight: bold; white-space: pre-wrap; min-height: 150px; font-family: monospace; }
        .reduction-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 13px; }

        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } .calc-container { order: -1; height: auto; } }
    </style>
</head>
<body>

    <div id="login-screen">
        <img src="https://i.imgur.com/LSSD-LOGO-HERE.png" alt="LSSD LOGO" width="100">
        <h2>LSSD SYSTEM</h2>
        <input type="text" id="user" placeholder="Tài khoản">
        <input type="password" id="pass" placeholder="Mật khẩu">
        <button class="btn-main" onclick="handleLogin()">ĐĂNG NHẬP</button>
        <p id="error" style="color:red; font-size:12px; margin-top: 10px;"></p>
    </div>

    <div id="app-screen">
        <header>
            <div style="font-weight: bold; color: var(--primary)">LSSD - HỖ TRỢ XỬ ÁN</div>
            <button onclick="handleLogout()" style="background:none; border:none; color:red; cursor:pointer; font-weight:bold;">Đăng xuất</button>
        </header>

        <div class="main-layout">
            <div class="crimes-container">
                <div class="search-bar">
                    <input type="text" id="search" placeholder="🔍 Tìm kiếm tội danh nhanh..." oninput="filterCrimes()">
                </div>
                <div id="law-list"></div>
            </div>

            <div class="calc-container">
                <input type="text" id="obj-name" placeholder="Tên đối tượng" oninput="calculate()">
                <input type="text" id="obj-cccd" placeholder="Số CCCD" oninput="calculate()">
                
                <div class="reduction-panel">
                    <label><input type="checkbox" id="nvqs" onchange="calculate()"> Giấy NVQS</label>
                    <label><input type="checkbox" id="coop" onchange="calculate()"> Hợp tác (5p)</label>
                    <label><input type="checkbox" id="invest" onchange="calculate()"> Điều tra (10p)</label>
                    <div style="display: flex; align-items: center; gap: 5px;">
                        <input type="number" id="bills" placeholder="Số bill nợ" oninput="calculate()" value="" min="6" style="margin: 0; padding: 8px;">
                        <span style="font-size: 11px; font-weight: bold;">Bills</span>
                    </div>
                </div>

                <div class="output-box" id="result-display">Tên: <br>CCCD: <br>Tội danh: <br>Mức án: 0p<br>Đã xử lý</div>

                <button class="btn-main" onclick="copyResult()">SAO CHÉP HỒ SƠ</button>
                <button class="btn-main" style="background:#7f8c8d" onclick="resetForm()">RESET</button>
            </div>
        </div>
    </div>

<script>
    const COMMON_ACCOUNT = { user: "LSSD", pass: "LSSD123" };

    const LAW_DATA = [
        { title: "KHOẢN 1 (20 PHÚT)", time: 20, stackable: false, items: ["Sử dụng nắm đấm gây rối", "Gây rối trật tự công cộng", "Cản trở người thi hành công vụ", "Hỗ trợ đồng bọn", "Sử dụng giáp trái phép", "Trộm cắp tài sản", "Nhập cư trái phép", "Vũ khí thô sơ công cộng", "Tàng trữ thảo dược", "Vu khống", "Lăng mạ xúc phạm", "Xúc phạm người đang làm nhiệm vụ"] },
        { title: "KHOẢN 2 (30 PHÚT)", time: 30, stackable: false, items: ["Gây thương tích chưa nghiêm trọng", "Chống đối người thi hành công vụ", "Xâm nhập trụ sở", "Đe dọa sĩ quan", "Rao bán vũ khí lậu", "Lừa đảo chiếm đoạt", "Giả dạng người nhà nước"] },
        { title: "KHOẢN 3 (50 PHÚT)", time: 50, stackable: true, items: ["Gây thương tích nghiêm trọng", "Bạo động thành phố"] },
        { title: "KHOẢN 4 (100 PHÚT)", time: 100, stackable: true, items: ["Tấn công nhân viên y tế"] },
        { title: "TỘI DANH ĐẶC BIỆT", time: 360, stackable: false, special: true, items: ["Vi phạm quy tắc ngành"] }
    ];

    function handleLogin() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if (u === COMMON_ACCOUNT.user && p === COMMON_ACCOUNT.pass) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            initLawList();
        } else {
            document.getElementById('error').innerText = "Tài khoản hoặc mật khẩu không đúng!";
        }
    }

    function handleLogout() { location.reload(); }

    function initLawList() {
        let html = '';
        LAW_DATA.forEach((section, sIdx) => {
            html += `<div class="law-section"><h3>${section.title}</h3>`;
            section.items.forEach((item, iIdx) => {
                html += `
                <div class="crime-card">
                    <input type="checkbox" class="cb-crime" id="cb-${sIdx}-${iIdx}" 
                           data-name="${item}" data-time="${section.time}" 
                           data-stackable="${section.stackable}" 
                           data-special="${section.special || false}"
                           onchange="calculate()">
                    <span onclick="toggleText('${sIdx}-${iIdx}')">${item}</span>
                    ${section.stackable ? `<input type="number" id="qty-${sIdx}-${iIdx}" value="1" min="1" oninput="calculate()">` : ''}
                </div>`;
            });
            html += `</div>`;
        });
        document.getElementById('law-list').innerHTML = html;
    }

    function toggleText(id) {
        const cb = document.getElementById('cb-' + id);
        cb.checked = !cb.checked;
        calculate();
    }

    function calculate() {
        let name = document.getElementById('obj-name').value || "Chưa rõ";
        let cccd = document.getElementById('obj-cccd').value || "Chưa rõ";
        
        let normalTotal = 0; 
        let specialTotal = 0; 
        let selected = [];
        let hasK2 = false;

        document.querySelectorAll('.cb-crime:checked').forEach(cb => {
            const time = parseInt(cb.dataset.time);
            const crimeName = cb.dataset.name;
            const isStack = cb.dataset.stackable === "true";
            const isSpecial = cb.dataset.special === "true";

            if (isSpecial) {
                specialTotal += time;
                selected.push(crimeName);
            } else {
                if (isStack) {
                    const idSuffix = cb.id.split('-').slice(1).join('-');
                    const qty = parseInt(document.getElementById('qty-' + idSuffix).value) || 1;
                    normalTotal += (time * qty);
                    selected.push(`${crimeName} (x${qty})`);
                } else {
                    normalTotal += time;
                    selected.push(crimeName);
                }
                if(time >= 30) hasK2 = true;
            }
        });

        if (normalTotal > 180) normalTotal = 180;

        let total = normalTotal + specialTotal;

        // Logic Nợ xấu: Chỉ tính khi ô không trống, trị số >= 6 và có tội Khoản 2 trở lên
        let billInput = document.getElementById('bills').value;
        if(billInput !== "" && hasK2) {
            let bills = parseInt(billInput);
            if(bills >= 6) {
                total += (bills * 5);
            }
        }
        
        if(document.getElementById('nvqs').checked) total -= 5;
        if(document.getElementById('coop').checked) total -= 5;
        if(document.getElementById('invest').checked) total -= 10;

        const result = `Tên: ${name}\nCCCD: ${cccd}\nTội danh: ${selected.join(', ') || 'Không có'}\nMức án: ${total > 0 ? total : 0}p\nĐã xử lý`;
        document.getElementById('result-display').innerText = result;
    }

    function filterCrimes() {
        let query = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.crime-card').forEach(card => {
            card.style.display = card.innerText.toLowerCase().includes(query) ? 'flex' : 'none';
        });
    }

    function copyResult() {
        navigator.clipboard.writeText(document.getElementById('result-display').innerText);
        alert("Đã sao chép hồ sơ!");
    }

    function resetForm() {
        document.querySelectorAll('.cb-crime').forEach(cb => cb.checked = false);
        document.querySelectorAll('input[id^="qty-"]').forEach(input => input.value = 1);
        document.getElementById('nvqs').checked = false;
        document.getElementById('coop').checked = false;
        document.getElementById('invest').checked = false;
        document.getElementById('obj-name').value = "";
        document.getElementById('obj-cccd').value = "";
        document.getElementById('bills').value = ""; // Để trống ô bill khi reset
        calculate(); 
    }
</script>
</body>
</html>
