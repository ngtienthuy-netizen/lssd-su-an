<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSSD - Hệ Thống Hỗ Trợ Xử Án</title>
    <style>
        :root {
            --primary: #d4a017;
            --dark: #1a1a1a;
            --glass: rgba(255, 255, 255, 0.95);
            --shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, rgba(26, 26, 26, 0.9) 0%, rgba(44, 62, 80, 0.9) 100%), 
                        url('MỜI BẠN CHÈN LINK ẢNH NỀN TOÀN TRANG VÀO ĐÂY') no-repeat center center fixed;
            background-size: cover;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* --- PHẦN ĐĂNG NHẬP (ĐÃ CHỈNH SỬA) --- */
        
        /* Container mới để chứa cả Logo và Khung đăng nhập */
        .login-wrapper {
            position: relative; /* Làm điểm tựa cho logo absolute */
            display: flex;
            justify-content: center;
            align-items: center;
            width: 350px;
            /* Thiết lập chiều cao tối thiểu để wrapper không bị co lại khi logo bị đẩy lên */
            min-height: 500px; 
        }

        /* Khung đăng nhập (Menu) */
        #login-screen {
            background: var(--glass);
            padding: 40px;
            border-radius: 20px;
            box-shadow: var(--shadow);
            text-align: center;
            width: 100%;
            z-index: 2; /* Nằm trên logo */
            position: relative; /* Để z-index hoạt động */
            margin-top: 100px; /* Tạo khoảng trống phía trên cho logo */
        }

        /* Logo Đăng nhập (Đã chỉnh sửa để to hơn và nằm sau 1 nửa) */
        .login-logo {
            position: absolute; /* Định vị tuyệt đối */
            top: 0;
            left: 50%; /* Căn giữa theo chiều ngang */
            /* Vừa to hơn, vừa đẩy một nửa lên trên và căn giữa */
            transform: translate(-50%, -50%); 
            width: 200px; /* Tăng kích thước to hơn */
            z-index: 1; /* Nằm dưới khung đăng nhập */
            opacity: 0.8; /* Làm mờ nhẹ để trông nhập vai hơn */
        }

        /* --- KẾT THÚC PHẦN ĐĂNG NHẬP --- */

        #login-screen h2 { color: var(--primary); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }
        
        input[type="text"], input[type="password"], input[type="number"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-main {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-main:hover { background: #b8860b; }

        /* ẨN TOÀN BỘ APP SCREEN MẶC ĐỊNH */
        #app-screen {
            display: none;
            width: 95%;
            max-width: 1200px;
            background: var(--glass);
            border-radius: 15px;
            height: 90vh;
            overflow: hidden;
            flex-direction: column;
            box-shadow: var(--shadow);
            position: fixed;
        }

        header {
            background: #fff;
            padding: 10px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--primary);
        }
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            flex: 1;
            overflow: hidden;
        }

        .crimes-container { padding: 20px; overflow-y: auto; border-right: 1px solid #eee; background: rgba(255, 255, 255, 0.5); }
        .search-bar { margin-bottom: 20px; position: sticky; top: 0; background: rgba(255, 255, 255, 0.8); padding: 10px 0; z-index: 10; }
        .law-section { margin-bottom: 25px; }
        .law-section h3 { border-left: 5px solid var(--primary); padding-left: 12px; color: #2c3e50; margin: 20px 0 10px 0; }
        
        .crime-card {
            display: flex; 
            align-items: center; 
            background: #fff; 
            margin-bottom: 6px;
            border-radius: 8px; 
            border: 1px solid #eee; 
            transition: 0.2s;
            overflow: hidden;
        }
        .crime-card:hover { background: #fff9e6; transform: translateX(3px); }
        
        .crime-label {
            display: flex;
            align-items: center;
            padding: 12px;
            width: 100%;
            cursor: pointer;
            user-select: none;
            font-size: 14px;
        }
        .crime-label input[type="checkbox"] { margin-right: 15px; transform: scale(1.3); cursor: pointer; }
        
        .crime-card input[type="number"] { 
            width: 65px; 
            margin-right: 10px;
            padding: 6px; 
            border-radius: 6px; 
            border: 1px solid #ccc; 
            font-size: 14px;
        }

        .calc-container { padding: 25px; background: #fdfdfd; display: flex; flex-direction: column; gap: 18px; border-radius: 0 0 15px 0; }
        .output-box { background: #fff5d7; border: 2px solid #e74c3c; padding: 20px; border-radius: 12px; font-weight: bold; white-space: pre-wrap; min-height: 160px; font-family: 'Consolas', monospace; font-size: 15px; line-height: 1.5; color: #2c3e50; }
        .reduction-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 13px; font-weight: bold; background: #eee; padding: 12px; border-radius: 10px; }
        
        label { cursor: pointer; display: flex; align-items: center; gap: 7px; }
        
        @media (max-width: 900px) { .main-layout { grid-template-columns: 1fr; } .calc-container { order: -1; height: auto; } }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <img src="https://i.postimg.cc/j2yZYfrG/C13FB2CA-20C2-4134-9399-9DBC992D0258-removebg-preview.png" alt="LSSD LOGO" class="login-logo">
        
        <div id="login-screen">
            <h2>LSSD SYSTEM</h2>
            <input type="text" id="user" placeholder="Tài khoản">
            <input type="password" id="pass" placeholder="Mật khẩu">
            <button class="btn-main" onclick="handleLogin()">ĐĂNG NHẬP</button>
            <p id="error" style="color:red; font-size:12px; margin-top: 10px; font-weight: bold;"></p>
        </div>
    </div>

    <div id="app-screen">
        <header>
            <div style="display: flex; align-items: center; gap: 15px;">
                <img src="MỜI BẠN CHÈN LINK LOGO HEADER VÀO ĐÂY" alt="LSSD LOGO MINI" width="40">
                <div style="font-weight: bold; color: var(--primary); font-size: 20px;">LOS SANTOS SHERIFF DEPARTMENT</div>
            </div>
            <button onclick="handleLogout()" style="background:#e74c3c; color:white; border:none; padding:8px 18px; border-radius:8px; cursor:pointer; font-weight:bold; transition: 0.2s;">Đăng xuất</button>
        </header>

        <div class="main-layout">
            <div class="crimes-container">
                <div class="search-bar">
                    <input type="text" id="search" placeholder="🔍 Tìm kiếm tội danh nhanh..." oninput="filterCrimes()" style="padding: 12px; border-radius: 8px; border: 1px solid #ddd; width: 100%; box-sizing: border-box;">
                </div>
                <div id="law-list"></div>
            </div>

            <div class="calc-container">
                <input type="text" id="obj-name" placeholder="Họ và Tên đối tượng" oninput="calculate()">
                <input type="text" id="obj-cccd" placeholder="Mã CCCD" oninput="calculate()">
                
                <div class="reduction-panel">
                    <label><input type="checkbox" id="coop" onchange="calculate()"> Hợp tác (Giảm 5p)</label>
                    <label><input type="checkbox" id="invest" onchange="calculate()"> Điều tra (Giảm 10p)</label>
                    <div style="display: flex; align-items: center; gap: 7px; grid-column: span 2; margin-top: 5px;">
                        <input type="number" id="bills" placeholder="Số bill nợ" oninput="calculate()" value="" min="6" style="margin: 0; padding: 10px; border-radius: 8px;">
                        <span style="font-size: 14px; font-weight: bold; color: #555;">Bills (Tối thiểu 6)</span>
                    </div>
                </div>

                <div class="output-box" id="result-display">Tên: <br>CCCD: <br>Tội danh: <br>Mức án: 0p<br>Đã xử lý</div>

                <button class="btn-main" onclick="copyResult()" style="background:#27ae60; box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);">SAO CHÉP HỒ SƠ (5 DÒNG)</button>
                <button class="btn-main" style="background:#7f8c8d" onclick="resetForm()">RESET TOÀN BỘ</button>
            </div>
        </div>
    </div>

<script>
    const COMMON_ACCOUNT = { user: "LSSD", pass: "LSSD123" };

    const LAW_DATA = [
        { title: "Khoản 1 (20 Phút - 60k$)", time: 20, stackable: false, items: ["Sử dụng nắm đấm gây rối", "Gây rối trật tự công cộng", "Cản trở người thi hành công vụ", "Hỗ trợ đồng bọn", "Sử dụng giáp trái phép", "Trộm cắp tài sản dân (Nhập nhà)", "Nhập cư trái phép", "Sử dụng vũ khí thô sơ công cộng", "Tàng trữ thảo dược lậu", "Vu khống người khác", "Lăng mạ xúc phạm người khác", "Xúc phạm người đang làm nhiệm vụ"] },
        { title: "Khoản 2 (30 Phút - 90k$)", time: 30, stackable: false, items: ["Gây thương tích chưa nghiêm trọng", "Chống đối người thi hành công vụ", "Xâm nhập trụ sở nhà nước", "Đe dọa người làm nhiệm vụ", "Rao bán vũ khí lậu công cộng", "Lừa đảo chiếm đoạt tài sản", "Giả dạng người nhà nước"] },
        { title: "Khoản 3 (50 Phút - Không bảo lãnh)", time: 50, stackable: true, items: ["Gây thương tích nghiêm trọng", "Bạo động thành phố"] },
        { title: "Khoản 4 (100 Phút - Không bảo lãnh)", time: 100, stackable: true, items: ["Tấn công nhân viên y tế"] },
        { title: "Tội Danh Đặc Biệt", time: 360, stackable: false, special: true, items: ["Vi phạm quy tắc ngành"] }
    ];

    function handleLogin() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if (u === COMMON_ACCOUNT.user && p === COMMON_ACCOUNT.pass) {
            document.getElementById('login-screen').style.display = 'none';
            // Khi đăng nhập thành công, ẩn cả cái container đăng nhập
            document.querySelector('.login-wrapper').style.display = 'none'; 
            document.getElementById('app-screen').style.display = 'flex';
            initLawList();
            document.getElementById('error').innerText = "";
        } else {
            document.getElementById('error').innerText = "Tài khoản hoặc mật khẩu không chính xác!";
        }
    }

    function handleLogout() { location.reload(); }

    function initLawList() {
        let html = '';
        LAW_DATA.forEach((section, sIdx) => {
            html += `<div class="law-section"><h3>${section.title}</h3>`;
            section.items.forEach((item, iIdx) => {
                const id = `cb-${sIdx}-${iIdx}`;
                html += `
                <div class="crime-card">
                    <label class="crime-label" for="${id}">
                        <input type="checkbox" class="cb-crime" id="${id}" 
                               data-name="${item}" data-time="${section.time}" 
                               data-stackable="${section.stackable}" 
                               data-special="${section.special || false}"
                               onchange="calculate()">
                        <span>${item}</span>
                    </label>
                    ${section.stackable ? `<input type="number" id="qty-${sIdx}-${iIdx}" value="1" min="1" oninput="calculate()">` : ''}
                </div>`;
            });
            html += `</div>`;
        });
        document.getElementById('law-list').innerHTML = html;
    }

    function calculate() {
        let name = document.getElementById('obj-name').value || "..................";
        let cccd = document.getElementById('obj-cccd').value || "..................";
        
        let normalTotal = 0; 
        let specialTotal = 0; 
        let selected = [];
        let hasK2 = false;

        document.querySelectorAll('.cb-crime:checked').forEach(cb => {
            const time = parseInt(cb.dataset.time);
            const crimeName = cb.dataset.name;
            const isStack = cb.dataset.stackable === "true";
            const isSpecial = cb.dataset.special === "true";

            if (isSpecial) {
                specialTotal += time;
                selected.push(crimeName);
            } else {
                if (isStack) {
                    const idSuffix = cb.id.split('-').slice(1).join('-');
                    const qty = parseInt(document.getElementById('qty-' + idSuffix).value) || 1;
                    normalTotal += (time * qty);
                    selected.push(`${crimeName} (x${qty})`);
                } else {
                    normalTotal += time;
                    selected.push(crimeName);
                }
                if(time >= 30) hasK2 = true;
            }
        });

        if (normalTotal > 180) normalTotal = 180;

        let total = normalTotal + specialTotal;

        let billInput = document.getElementById('bills').value;
        if(billInput !== "" && hasK2) {
            let bills = parseInt(billInput);
            if(bills >= 6) {
                total += (bills * 5);
            }
        }
        
        if(document.getElementById('coop').checked) total -= 5;
        if(document.getElementById('invest').checked) total -= 10;

        const result = `Tên: ${name}\nCCCD: ${cccd}\nTội danh: ${selected.join(', ') || 'Không có'}\nMức án: ${total > 0 ? total : 0} phút tù\nĐã xử lý`;
        document.getElementById('result-display').innerText = result;
    }

    function filterCrimes() {
        let query = document.getElementById('search').value.toLowerCase();
        document.querySelectorAll('.crime-card').forEach(card => {
            let text = card.innerText.toLowerCase();
            card.style.display = text.includes(query) ? 'flex' : 'none';
        });
    }

    function copyResult() {
        navigator.clipboard.writeText(document.getElementById('result-display').innerText);
        alert("Đã sao chép hồ sơ 5 dòng thành công!");
    }

    function resetForm() {
        document.querySelectorAll('.cb-crime').forEach(cb => cb.checked = false);
        document.querySelectorAll('input[id^="qty-"]').forEach(input => input.value = 1);
        document.getElementById('coop').checked = false;
        document.getElementById('invest').checked = false;
        document.getElementById('obj-name').value = "";
        document.getElementById('obj-cccd').value = "";
        document.getElementById('bills').value = ""; 
        calculate(); 
    }
</script>
</body>
</html>
